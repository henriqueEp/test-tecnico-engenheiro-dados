[project]
name = "test-tecnico-engenheiro-dados"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = ["pyspark==3.5.0"]

[dependency-groups]
dev = ["pytest>=8.0.0", "ruff>=0.4.0"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]   # pycodestyle errors, pyflakes, isort
ignore = ["E501"]           # line too long já coberto pelo formatter
